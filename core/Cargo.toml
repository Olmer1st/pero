[package]
name = "pero-server"
description = "Pero server: the only network-facing process; health endpoint over HTTPS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "display"] }
pero-shared = { version = "0.1.0", path = "../shared", features = ["sqlx"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.11.1"
getrandom = "0.4.3"

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }
