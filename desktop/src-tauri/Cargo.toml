# The desktop app is its own Cargo workspace, outside the server's: Tauri brings several hundred crates that the
# server must not carry, and the server's audits stay about the server.
[workspace]

[package]
name = "pero-desktop"
description = "Pero desktop app: the web client in a window, talking to the Pero server with a pinned certificate authority"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", default-features = false, features = ["wry", "x11", "compression"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
